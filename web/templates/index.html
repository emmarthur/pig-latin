<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pig Latin Translator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Fredoka:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="bg-blob bg-blob-a" aria-hidden="true"></div>
    <div class="bg-blob bg-blob-b" aria-hidden="true"></div>

    <main class="page">
      <nav class="page-nav" aria-label="Page">
        <a class="nav-link" href="/help">Help</a>
      </nav>

      <header class="hero">
        <div class="hero-badge" aria-hidden="true">🐷</div>
        <h1>Pig Latin</h1>
        <p class="tagline">Turn everyday English into Igpay Atinlay, word by word</p>
      </header>

      <section class="card">
        <label class="field" for="source-text">
          <span class="field-label">English</span>
          <textarea id="source-text" rows="4" placeholder="Type or paste a message…"></textarea>
        </label>

        <div class="examples">
          <span class="examples-label">Try:</span>
          <div class="example-chips">
            {% for ex in examples %}
            <button type="button" class="chip" data-text="{{ ex }}">{{ ex }}</button>
            {% endfor %}
          </div>
        </div>

        <button type="button" id="btn-translate" class="btn btn-primary">Translate</button>
        <p id="error-text" class="error" role="alert" hidden></p>
      </section>

      <section class="card output-card" id="output-card" hidden>
        <label class="field" for="output-text">
          <span class="field-label">Pig Latin</span>
          <textarea id="output-text" rows="4" readonly></textarea>
        </label>
        <button type="button" id="btn-copy" class="btn btn-secondary">Copy result</button>
        <p id="copy-status" class="copy-status" hidden>Copied to clipboard.</p>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
